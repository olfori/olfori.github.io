
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My VR Playground</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    // ПЕРЕМЕЩЕНИЕ ЛЕВЫМ СТИКОМ
    AFRAME.registerComponent('vr-movement', {
      schema: {
        speed: {default: 2}
      },

      init: function () {
        this.axis = {x: 0, y: 0};
        this.camera = document.querySelector('#camera');
        this.leftHand = document.querySelector('#leftHand');

        this.leftHand.addEventListener('thumbstickmoved', evt => {
          this.axis.x = evt.detail.x;
          this.axis.y = evt.detail.y;
        });

        this.direction = new THREE.Vector3();
        this.forward = new THREE.Vector3();
        this.right = new THREE.Vector3();
      },

      tick: function (time, delta) {
        if (!this.camera || !delta) return;

        let x = Math.abs(this.axis.x) > 0.15 ? this.axis.x : 0;
        let y = Math.abs(this.axis.y) > 0.15 ? this.axis.y : 0;

        if (x === 0 && y === 0) return;

        const camera3D = this.camera.object3D;

        camera3D.getWorldDirection(this.forward);
        this.forward.y = 0;
        this.forward.normalize();

        this.right.set(
          -this.forward.z,
          0,
          this.forward.x
        );

        this.direction
          .copy(this.right)
          .multiplyScalar(x)
          .addScaledVector(this.forward, -y);

        if (this.direction.lengthSq() > 1) {
          this.direction.normalize();
        }

        const distance = this.data.speed * delta / 1000;

        this.el.object3D.position.addScaledVector(
          this.direction,
          distance
        );
      }
    });

    // ВЗЯТЬ И ПЕРЕДВИНУТЬ ПРЕДМЕТ
    AFRAME.registerComponent('grab-controller', {
      init: function () {
        this.held = null;

        this.el.addEventListener('triggerdown', () => {
          this.grab();
        });

        this.el.addEventListener('triggerup', () => {
          this.release();
        });
      },

      grab: function () {
        if (this.held) return;

        const ray = this.el.components.raycaster;
        if (!ray) return;

        let target = null;
        let nearest = Infinity;

        document.querySelectorAll('.grabbable').forEach(el => {
          if (el.dataset.held === 'true') return;

          const hit = ray.getIntersection(el);

          if (hit && hit.distance < nearest) {
            nearest = hit.distance;
            target = el;
          }
        });

        if (!target) return;

        this.held = target;
        target.dataset.held = 'true';

        const obj = target.object3D;

        // Прикрепляем к контроллеру.
        this.el.object3D.attach(obj);

        // Помещаем предмет перед контроллером.
        obj.position.set(0, 0, -0.45);
        obj.rotation.set(0, 0, 0);

        target.setAttribute('material', 'opacity', 0.85);
      },

      release: function () {
        if (!this.held) return;

        const target = this.held;
        const obj = target.object3D;
        const scene = this.el.sceneEl.object3D;

        // Сохраняем мировые координаты.
        obj.updateMatrixWorld(true);
        scene.attach(obj);

        const p = obj.position;
        const r = obj.rotation;

        target.setAttribute('position', {
          x: p.x, y: p.y, z: p.z
        });

        target.setAttribute('rotation', {
          x: THREE.MathUtils.radToDeg(r.x),
          y: THREE.MathUtils.radToDeg(r.y),
          z: THREE.MathUtils.radToDeg(r.z)
        });

        target.setAttribute('material', 'opacity', 1);

        target.dataset.held = 'false';
        this.held = null;
      }
    });
  </script>
</head>

<body>
<a-scene
  background="color: #DDE8F2"
  renderer="antialias: true"
  xr-mode-ui="enabled: true">

  <!-- ОСВЕЩЕНИЕ -->
  <a-entity light="type: ambient; intensity: 0.7"></a-entity>
  <a-entity
    light="type: directional; intensity: 1"
    position="-2 6 3">
  </a-entity>

  <!-- ИГРОК -->
  <a-entity
    id="rig"
    position="0 0 0"
    vr-movement="speed: 2"
    wasd-controls="acceleration: 25">

    <a-entity
      id="camera"
      camera
      look-controls
      position="0 1.6 0">
    </a-entity>

    <!-- ЛЕВЫЙ КОНТРОЛЛЕР -->
    <a-entity
      id="leftHand"
      laser-controls="hand: left"
      raycaster="objects: .grabbable; far: 6"
      grab-controller>
    </a-entity>

    <!-- ПРАВЫЙ КОНТРОЛЛЕР -->
    <a-entity
      id="rightHand"
      laser-controls="hand: right"
      raycaster="objects: .grabbable; far: 6"
      grab-controller>
    </a-entity>
  </a-entity>

  <!-- ПОЛ -->
  <a-plane
    position="0 -0.02 -3"
    rotation="-90 0 0"
    width="30"
    height="30"
    color="#8BC69B">
  </a-plane>

  <!-- ПРЕДМЕТЫ -->
  <a-box
    class="grabbable"
    position="-1 1.5 -3"
    width="0.6" height="0.6" depth="0.6"
    color="#4CC3D9">
  </a-box>

  <a-sphere
    class="grabbable"
    position="1 1.5 -3"
    radius="0.4"
    color="#EF2D5E">
  </a-sphere>

  <a-cylinder
    class="grabbable"
    position="0 1.3 -5"
    radius="0.35"
    height="0.8"
    color="#FFC65D">
  </a-cylinder>

  <a-box
    class="grabbable"
    position="2 1 -4"
    width="0.8"
    height="0.8"
    depth="0.8"
    color="#8A5CFF">
  </a-box>

  <!-- ОРИЕНТИРЫ КОМНАТЫ -->
  <a-box
    position="0 1.5 -8"
    width="12" height="3" depth="0.1"
    color="#E1E8EF">
  </a-box>

  <a-box
    position="-6 1.5 -3"
    width="0.1" height="3" depth="10"
    color="#D1DBE5">
  </a-box>

  <a-box
    position="6 1.5 -3"
    width="0.1" height="3" depth="10"
    color="#D1DBE5">
  </a-box>

  <!-- НАДПИСЬ -->
  <a-text
    value="VR Playground"
    position="0 2.5 -6"
    align="center"
    color="#26364A"
    width="5">
  </a-text>

  <a-text
    value="Left stick: Move | Trigger: Grab"
    position="0 2.1 -6"
    align="center"
    color="#26364A"
    width="4">
  </a-text>

  <a-sky color="#DDE8F2"></a-sky>
</a-scene>
</body>
</html>
